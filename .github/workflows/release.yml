name: Release

on:
  push:
    tags:
      - '*'
      - '!v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG}"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            if [ -f CHANGELOG.md ]; then
              # 提取 CHANGELOG 中当前版本的段落作为 Release 说明
              awk -v ver="${VERSION}" '
                /^## \[?'"${VERSION}"'\]?/ { found=1; print; next }
                /^## \[/ && found { exit }
                found { print }
              ' CHANGELOG.md > release_notes.md || true
            fi
            if [ ! -s release_notes.md ]; then
              echo "Release ${TAG}" > release_notes.md
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
